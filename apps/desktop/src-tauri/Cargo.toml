[package]
name = "chapterize"
version = "0.1.0"
description = "Read one chapter at a time, with AI"
authors = ["l11"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chapterize_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
# Send-to-Kindle: SMTP with the credential held by the OS keyring, never on disk.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
