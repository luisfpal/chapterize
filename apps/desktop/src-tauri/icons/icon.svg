<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3A3129"/>
      <stop offset="1" stop-color="#171410"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A52"/>
      <stop offset="1" stop-color="#D2551A"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <!-- One book fanning into separate chapters. Pinned at the lower left so the
       sheets splay upward-right; clipped so nothing escapes the tile. -->
  <g clip-path="url(#tileClip)">
    <g transform="rotate(14 186 378)">
      <rect x="156" y="146" width="176" height="234" rx="15" fill="#8B8171"/>
    </g>
    <g transform="rotate(7 186 378)">
      <rect x="156" y="146" width="176" height="234" rx="15" fill="#BCB09A"/>
    </g>
    <g>
      <rect x="156" y="146" width="176" height="234" rx="15" fill="#F6F1E5"/>
      <path d="M156 161a15 15 0 0 1 15-15h29v234h-29a15 15 0 0 1-15-15z" fill="url(#spine)"/>
      <g fill="#39312A">
        <rect x="224" y="200" width="86" height="17" rx="8.5"/>
        <rect x="224" y="245" width="86" height="17" rx="8.5"/>
        <rect x="224" y="290" width="56" height="17" rx="8.5"/>
      </g>
    </g>
  </g>
</svg>
