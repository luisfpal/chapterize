<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapterize</title>
    <script>
      // Registered before any module is fetched, so a failure to load or parse
      // the bundle still reaches the screen instead of leaving a blank window.
      (function () {
        function show(what, detail) {
          var root = document.getElementById('root');
          if (!root || root.dataset.fatal) return;
          root.dataset.fatal = '1';
          var pre = document.createElement('pre');
          pre.textContent = detail;
          root.innerHTML = '<h1>Chapterize could not start</h1><p>' + what + '</p>';
          root.appendChild(pre);
          root.style.cssText = 'padding:6vh 30px;font:13px system-ui;color:#e6e3dd';
          pre.style.cssText =
            'white-space:pre-wrap;word-break:break-word;background:#1c1b21;' +
            'border:1px solid #2e2d36;border-radius:7px;padding:14px;font-size:11.5px';
        }
        window.addEventListener('error', function (e) {
          show('While loading', (e.error && (e.error.stack || e.error.message)) || e.message ||
            ('Failed to load ' + (e.target && (e.target.src || e.target.href))));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('In a background task', (r && (r.stack || r.message)) || String(r));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
