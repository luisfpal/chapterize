name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel are separate builds; Tauri cannot cross-compile
          # between them, and neither can be produced from a Linux runner.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # Built on 22.04 deliberately: linking against an older glibc lets the
          # AppImage and .deb run on newer distributions, but not the reverse.
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Chapterize ${{ github.ref_name }}'
          releaseBody: |
            ### macOS — required on first launch

            These builds are unsigned, so Gatekeeper will refuse them with
            "Chapterize is damaged and can't be opened". Clear the quarantine flag once:

            ```
            xattr -cr /Applications/Chapterize.app
            ```

            Signing properly needs a $99/yr Apple Developer certificate.

            ### Linux
            Download the `.AppImage` (`chmod +x` it) or install the `.deb`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
