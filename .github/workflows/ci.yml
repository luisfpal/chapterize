name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # npm test runs the parser suite and scripts/verify.mjs. The suite skips
      # real books when CHAPTERIZE_FIXTURES is unset. verify builds its own.
      - run: npm test

  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri -> target }
      # Guards the filesystem commands, including the self-copy that once
      # truncated a book to zero bytes when it was re-split.
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
